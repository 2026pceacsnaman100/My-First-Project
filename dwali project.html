<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple calculator</title>
    <link rel="stylesheet" href="dawali project.css">
</head>
<body>

    <div id="box">
        <h3 style="margin: 0; color: #ff9f0a;">Calculator</h3>
        <div id="box2">
            <label for="num">enter a number:</label>
            <input type="text" id="num" readonly>
        </div>

        <!-- ⚡ ध्यान दें: सारे बटन इसी एक 'buttons-grid' के अंदर होने चाहिए -->
        <div class="buttons-grid">
            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>
            
            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            
            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            
            <button class="btn operator" onclick="appendValue('+')">+</button>
            <button class="btn operator" onclick="appendValue('-')">-</button>
            <button class="btn operator" onclick="appendValue('*')">*</button>
            
            <button class="btn operator" onclick="appendValue('/')">/</button>
            <button class="btn operator" onclick="appendValue('%')">%</button>
            <button class="btn" onclick="appendValue('0')">0</button>
            
            <button class="btn" onclick="appendValue('00')">00</button>
            <button class="btn action" onclick="clearDisplay()">AC</button>
            <button class="btn" onclick="appendValue('.')">.</button>
            
            <!-- नीचे हमने बराबर (=) का बटन जोड़ा है जो कैलकुलेट करेगा -->
            <button class="btn equal" onclick="calculate()">=</button> 
        </div>
    </div>

    <!-- ⚡ JavaScript कोड जो बटनों को चालू करेगा -->
    <script>
        const display = document.getElementById('num');

        function appendValue(val) {
            display.value += val;
        }

        function clearDisplay() {
            display.value = '';
        }

        function calculate() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = 'Error';
            }
        }
    </script>

</body>
</html>
